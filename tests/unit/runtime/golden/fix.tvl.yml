tvl_version: '1.3'
requirements:
- name: latency
  kind: rate_bound
  unit: trace
  violation:
    metric: wall_clock_latency_ms
    exceeds: 2000
  max_rate: 0.05
monitors:
- name: latency_monitor
  requirement: latency
  phase: runtime
  profile: backend_v1
  evidence:
    source: backend_trace_metadata
    deployment_environment: production
  window:
    tumbling_hours: 6
    grace_minutes: 30
  decision:
    method: clopper_pearson_exact_v1
    confidence: 0.95
    false_alarm_budget: 0.05
    min_samples: 200
    max_unresolved_fraction: 0.05
    horizon_days: 30
  episode:
    closure_windows: 2
    closure_max_age_hours: 24
responses:
- name: latency_ladder
  rules:
  - id: alert_opened
    trigger:
      monitor: latency_monitor
      event: episode_opened
    do: notify
    severity: warning
  - id: alert_resolved
    trigger:
      monitor: latency_monitor
      event: episode_resolved
    do: notify
    severity: info
  - id: alert_withdrawn
    trigger:
      monitor: latency_monitor
      event: episode_withdrawn
    do: notify
    severity: info
  - id: restore
    trigger:
      monitor: latency_monitor
      event: episode_opened
    do: open_next_step
  - id: fix
    trigger:
      monitor: latency_monitor
      event: episode_opened
    do: optimize
    approval: human
