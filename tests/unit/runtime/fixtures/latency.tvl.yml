tvl_version: "1.3"
requirements:
  - { name: latency_2s, kind: rate_bound, unit: trace,
      violation: { metric: wall_clock_latency_ms, exceeds: 2000 }, max_rate: 0.05 }
monitors:
  - { name: latency_2s_prod, requirement: latency_2s, phase: runtime, profile: backend_v1,
      evidence: { source: backend_trace_metadata, deployment_environment: production },
      decision: { method: clopper_pearson_exact_v1 } }
responses:
  - name: latency_ladder
    rules:
      - { id: alert,   trigger: { monitor: latency_2s_prod, event: episode_opened },   do: notify, severity: warning }
      - { id: restore, trigger: { monitor: latency_2s_prod, event: episode_opened },   do: open_next_step }
      - { id: fix,     trigger: { monitor: latency_2s_prod, event: episode_opened },   do: optimize, approval: human }
      - { id: ok,      trigger: { monitor: latency_2s_prod, event: episode_resolved }, do: notify, severity: info }
