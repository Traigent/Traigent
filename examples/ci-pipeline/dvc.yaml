stages:
  prepare_dataset:
    cmd: python scripts/auto_tune/prepare_dataset.py
    deps:
      - scripts/auto_tune/prepare_dataset.py
      - data/raw
    params:
      - prepare.split_ratio
      - prepare.seed
    outs:
      - data/prepared

  optimize:
    cmd:
      - >-
        python -m traigent optimize optimize_target.py
        --algorithm ${optimize.strategy}
        --max-trials ${optimize.max_trials}
        --timeout ${optimize.timeout}
        --output-dir optimization_results
      - python export_results.py optimization_results
    deps:
      - optimize_target.py
      - export_results.py
      - data/prepared
    params:
      - optimize.max_trials
      - optimize.strategy
      - optimize.budget
    outs:
      - optimization_results/latest.json
    metrics:
      - optimization_results/metrics.json:
          cache: false

  evaluate:
    cmd: python scripts/auto_tune/evaluate_performance.py
    deps:
      - scripts/auto_tune/evaluate_performance.py
      - optimization_results/latest.json
    params:
      - evaluate.baseline_path
      - evaluate.threshold
    metrics:
      - performance_report.json:
          cache: false
    plots:
      - performance_plots:
          x: trial
          y: score

  report:
    cmd: python scripts/auto_tune/generate_report.py
    deps:
      - scripts/auto_tune/generate_report.py
      - performance_report.json
      - optimization_results/latest.json
    outs:
      - reports/performance_report.md:
          cache: false
      - reports/performance_report.html:
          cache: false
