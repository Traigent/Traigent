services:
  # Development environment with all dependencies
  dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    environment:
      - TRAIGENT_MOCK_LLM=true
      - TRAIGENT_OFFLINE_MODE=true
      - TRAIGENT_LOG_LEVEL=DEBUG
      # Local-dev opt-out of the production-fail-closed credential check
      # (SDK#896). Production deployments MUST instead set
      # TRAIGENT_ENCRYPTION_KEY and leave TRAIGENT_ENV unset.
      - TRAIGENT_ENV=development
    command: ["bash"]
    stdin_open: true
    tty: true

  # Run tests
  test:
    build:
      context: .
      target: testing
    volumes:
      - .:/app
    environment:
      - TRAIGENT_MOCK_LLM=true
      - TRAIGENT_OFFLINE_MODE=true
    command: ["pytest", "tests/", "-v", "--tb=short"]

  # Run unit tests only (faster)
  test-unit:
    build:
      context: .
      target: testing
    volumes:
      - .:/app
    environment:
      - TRAIGENT_MOCK_LLM=true
      - TRAIGENT_OFFLINE_MODE=true
    command: ["pytest", "tests/unit/", "-v", "--tb=short"]

  # Run linting
  lint:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: ["make", "lint"]

  # Run formatting
  format:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: ["make", "format"]

  # Interactive Python shell with traigent loaded
  shell:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    environment:
      - TRAIGENT_MOCK_LLM=true
      - TRAIGENT_OFFLINE_MODE=true
    command: ["python", "-c", "import traigent; import IPython; IPython.embed()"]
    stdin_open: true
    tty: true
