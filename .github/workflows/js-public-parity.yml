name: JS Public Parity

on:
  pull_request:
    branches:
      - main
    # Client/config file moves outside these conventional module names are still
    # caught by the weekly schedule; keep PR triggers scoped to parity-relevant
    # files so unrelated Python changes do not pay the cross-repo clone/install cost.
    paths:
      - ".github/workflows/js-public-parity.yml"
      - "tests/cross_sdk_oracles/test_js_public_parity_manifest.py"
      - "traigent/__init__.py"
      - "traigent/**/client.py"
      - "traigent/**/config.py"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  js-public-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        install-profile:
          - name: base-dev
            extras: ".[dev]"
          - name: full-all
            extras: ".[dev,all]"

    steps:
      - name: Checkout Python SDK
        uses: actions/checkout@v7
        with:
          path: Traigent

      # Mint a spine-dispatch App installation token instead of a PAT
      # (TRAIGENT_JS_SDK_TOKEN / TRAIGENT_PRIVATE_DEPS_TOKEN — both PATs; org
      # SAML SSO enforcement since 2026-07-24 revokes a PAT's org SSO grant,
      # confirmed as a 403 on this exact checkout in run 30643670166 / issue
      # #2065). `owner:` with no `repositories:` is required so the token can
      # reach the sibling traigent-js and TraigentSchema repos, not just this
      # one.
      - name: Mint cross-repo App token
        id: cross-repo-app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SPINE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SPINE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check cross-repo token
        id: cross-repo-token
        env:
          CROSS_REPO_TOKEN: ${{ steps.cross-repo-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # A missing token here used to `exit 0` after a warning, which let
          # this job report success having checked out neither traigent-js
          # nor TraigentSchema and run zero parity assertions. A quietly
          # skipped parity guard reads as "parity holds" when nothing was
          # ever verified. This is a trusted context (same-repo PR/dispatch/
          # schedule against a private repo with a single authorized
          # principal, not an untrusted fork), so a missing token is operator
          # misconfiguration, not a legitimate skip: fail loudly, mirroring
          # the hardening already applied to validation-g8-dispatch.yml.
          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo "::error::spine-dispatch App token unavailable (SPINE_DISPATCH_APP_ID/SPINE_DISPATCH_APP_PRIVATE_KEY not configured, mint failed, or the App is not installed on Traigent/traigent-js and Traigent/TraigentSchema); cannot run the JS public parity guard. Configure the secrets/App installation instead of letting this check silently pass."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      # The JS API-surface snapshot remains sourced from traigent-js main so the
      # Python guard tracks the next JS release surface, instead of a vendored
      # copy or the latest npm-published tag.
      - name: Checkout JS SDK
        if: steps.cross-repo-token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: Traigent/traigent-js
          ref: main
          path: traigent-js
          token: ${{ steps.cross-repo-app-token.outputs.token }}

      - name: Checkout TraigentSchema
        if: steps.cross-repo-token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: Traigent/TraigentSchema
          ref: main
          path: TraigentSchema
          token: ${{ steps.cross-repo-app-token.outputs.token }}

      - name: Set up Python
        if: steps.cross-repo-token.outputs.available == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python SDK (${{ matrix.install-profile.name }})
        if: steps.cross-repo-token.outputs.available == 'true'
        working-directory: Traigent
        run: |
          bash scripts/ci/install_sdk_requirements.sh build wheel -e "${{ matrix.install-profile.extras }}"

      - name: Check JS public parity
        if: steps.cross-repo-token.outputs.available == 'true'
        working-directory: Traigent
        env:
          TRAIGENT_ENTERPRISE_ROOT: ${{ github.workspace }}
          TRAIGENT_PARITY_MANIFEST: ${{ github.workspace }}/TraigentSchema/parity/python-js-sdk.json
          TRAIGENT_JS_API_SURFACE_SNAPSHOT: ${{ github.workspace }}/traigent-js/tests/integration/fixtures/api-surface.snapshot.json
          TRAIGENT_MOCK_LLM: "true"
          TRAIGENT_OFFLINE_MODE: "true"
          PYTHONPATH: .
        run: |
          pytest -o addopts= -q tests/cross_sdk_oracles/test_js_public_parity_manifest.py
