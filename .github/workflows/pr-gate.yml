name: SDK Required PR Gate

# Fast required gate for develop PRs + merge-queue candidates (two-tier CI
# policy, mirroring TraigentBackend): develop PRs run preflight (changed-file
# ruff) + the full unit suite (pytest -n auto via addopts); the comprehensive
# release-gate (lint-type, tests-unit, tests-integration, security, codeql)
# continues to protect main. Before this gate, develop PRs ran NO tests at all.

on:
  pull_request:
    branches: [develop, main]
    # Default types + ready_for_review so flipping a draft to ready runs the gate.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge-queue candidate refs (gh-readonly-queue/*); required checks must
  # report on the candidate commit.
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: sdk-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  changes:
    name: detect-changes
    # Skip CI on draft PRs (they can't merge); merge_group always runs.
    # Downstream jobs skip and required-pr-gate still passes (skipped deps = pass).
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      py_changed: ${{ steps.changed.outputs.py_changed }}
      code_changed: ${{ steps.changed.outputs.code_changed }}
      # Total files touched by this diff range, independent of any path
      # pattern. required-pr-gate's skip verification
      # (scripts/ci/check_required_gate.py) trusts a downstream job's
      # `false` gate ONLY when this is > 0 -- a range that produced ZERO
      # files is a broken/empty range, not "nothing relevant changed".
      changed_file_count: ${{ steps.changed.outputs.changed_file_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # Three-dot (merge-base) range: classify only what THIS PR changes.
          # For merge_group events, classify what the queue candidate changes
          # on the base branch; FAIL CLOSED on missing shas (an empty range
          # would classify everything unchanged -> untested silent-green merge).
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
            head_sha="${{ github.event.merge_group.head_sha }}"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::merge_group event missing base/head sha; refusing to classify"
              exit 1
            fi
            range="${base_sha}...${head_sha}"
          else
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          fi
          changed_files="$(git diff --name-only --diff-filter=ACMRT "$range")"

          # Emit the raw file count BEFORE any pattern filtering. Consumed by
          # required-pr-gate's classifier-gated skip verification: a job may
          # only treat its own `false` gate as trustworthy if this is > 0.
          if [ -z "$changed_files" ]; then
            changed_file_count=0
          else
            changed_file_count="$(printf '%s\n' "$changed_files" | wc -l)"
          fi
          echo "changed_file_count=${changed_file_count}" >> "$GITHUB_OUTPUT"

          has_match() {
            printf '%s\n' "$changed_files" | grep -Eq "$1"
          }
          set_output_bool() {
            local name="$1"; shift
            if "$@"; then echo "${name}=true" >> "$GITHUB_OUTPUT"; else echo "${name}=false" >> "$GITHUB_OUTPUT"; fi
          }

          set_output_bool py_changed has_match '\.py$'
          set_output_bool code_changed has_match '^(traigent|traigent_validation|tests|scripts|walkthrough)/|^(pyproject\.toml|requirements[^/]*\.txt|\.github/workflows/pr-gate\.yml)'

  schema-types:
    name: schema-types
    # The FIRST real gate (mirrors traigent-js's test:ci, where
    # check:schema-types is literally the first command) — deliberately not
    # gated on `changes` output or fork-safety like `unit`/`mcp-contract`:
    # traigent/generated/schema_types.py can drift for reasons invisible to
    # this repo's own diff (the pinned TraigentSchema commit moves, or someone
    # hand-edits the committed file), so it always runs. It does need the
    # SCHEMA_TOKEN secret to check out the private TraigentSchema repo, so
    # (like `unit`) it only runs for same-repo PRs; fork PRs skip it and
    # `required-pr-gate` treats skipped as passing (see that job's comment).
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned TraigentSchema revision this generator reads from. Bump this
      # SHA deliberately (in the same PR that regenerates
      # traigent/generated/schema_types.py) when TraigentSchema changes need
      # to land here — never track a moving branch, or this gate becomes
      # time-dependent (see tools/spine-trail memory on time-dependent gates).
      - uses: actions/checkout@v7
        with:
          repository: Traigent/TraigentSchema
          ref: 43b20f725f5c912501a852c21ff34ada3d40e6d1
          path: TraigentSchema
          token: ${{ secrets.TRAIGENT_JS_SDK_TOKEN || secrets.TRAIGENT_PRIVATE_DEPS_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check generated schema types are current
        env:
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/TraigentSchema
        run: python scripts/generate_schema_types.py --check

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Pin to the exact version declared in pyproject.toml's `dev` extra
          # (issue #1550) — installing unpinned `ruff` here let upstream
          # releases retroactively fail preflight on pre-existing lint debt
          # in unrelated PRs (e.g. PR #1540). pyproject.toml is the single
          # source of truth; bump the pin there, not here.
          ruff_version="$(python scripts/ci/get_ruff_pin.py)"
          echo "Pinning preflight ruff to ${ruff_version} (from pyproject.toml)"
          pip install "ruff==${ruff_version}"
      - name: Run changed-file Ruff checks
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.py_changed }}" != "true" ]; then
            echo "No Python files changed; skipping Ruff preflight."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            range="${{ github.event.merge_group.base_sha }}...${{ github.event.merge_group.head_sha }}"
          else
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          fi
          changed_py="$(git diff --name-only --diff-filter=ACMRT "$range" -- '*.py')"
          printf '%s\n' "$changed_py" | xargs -r ruff check --output-format=github
          printf '%s\n' "$changed_py" | xargs -r ruff format --check

  unit:
    name: unit
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, preflight]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sdk-pr-gate-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sdk-pr-gate-
            ${{ runner.os }}-pip-
      - name: Install test deps
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[all,dev]"
      - name: Install pinned economics Schema contract
        # The economics contract-drift tests (tests/unit/economics) hard-require
        # the exact TraigentSchema economics contract and must not silently
        # skip. traigent-schema 5.0.0 is not on PyPI yet, so install it from
        # the pinned Schema commit. Restamp the SHA when the Schema PR merges.
        env:
          SCHEMA_TOKEN: ${{ secrets.TRAIGENT_JS_SDK_TOKEN || secrets.TRAIGENT_PRIVATE_DEPS_TOKEN }}
        run: |
          pip install "traigent-schema @ git+https://x-access-token:${SCHEMA_TOKEN}@github.com/Traigent/TraigentSchema.git@01f3e2a2bbc1ca7d1b1cc8dde94f82d73dbe822a"
      - name: Run unit tests
        env:
          PYTHONPATH: .
          # This lane installs the pinned economics Schema above, so a missing
          # traigent_schema here means the install step broke — not that the
          # developer lacks a token. Setting this turns the module-level skip in
          # tests/unit/economics/test_schema.py into a hard failure, so a broken
          # install can never downgrade the contract lane to a silent green.
          # Variable name is defined once in tests/unit/economics/conftest.py as
          # REQUIRE_SCHEMA_ENV; keep the two in sync.
          TRAIGENT_REQUIRE_ECONOMICS_SCHEMA: "1"
        # pyproject addopts already include -n auto --dist loadgroup (xdist).
        run: pytest tests/unit -q --tb=short

  collection:
    name: collection
    # Deliberately NOT gated on head.repo == github.repository: this job needs no
    # secrets, so it must protect fork PRs too. `unit` and `mcp-contract` cannot,
    # because they install a token-gated dependency.
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    # A collection hang is the failure mode this job exists to catch, so cap it
    # low: import-time-only work that measures ~11s locally must never sit in the
    # queue. Any future import-time hang fails loudly instead of stalling.
    timeout-minutes: 10
    needs: [changes, preflight]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        # NOTE: the pinned economics Schema is deliberately NOT installed here
        # (unlike the `unit` job). That is the point of this job: it reproduces
        # the environment every local developer actually has — one without the
        # private, token-gated traigent-schema git pin — and proves the whole
        # suite still *collects* there. It also exercises the module-level skip
        # in tests/unit/economics/test_schema.py, which would otherwise never run
        # in CI and could rot unnoticed. Do not add the schema install here.
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[all,dev]"
      - name: Verify the whole test suite collects
        env:
          PYTHONPATH: .
          TRAIGENT_MOCK_LLM: "true"
          TRAIGENT_OFFLINE_MODE: "true"
        # Pass/fail is the exit code alone: --collect-only exits 2 on any
        # collection error and 0 when clean. No output grep and no pinned test
        # count, so this cannot go stale as tests are added.
        #
        # `-o addopts=` clears pyproject's addopts on purpose. Those addopts
        # --ignore three paths for *runtime* reasons (hangs); ignoring them here
        # would let their imports rot invisibly, which is the exact class of
        # false-green this gate exists to prevent. Clearing addopts also drops
        # xdist, which collection does not need.
        #
        # `-rs` keeps optional-dependency skips visible in the log, so a skip
        # that starts hiding something is noticeable in review.
        run: |
          pytest --collect-only -q tests/ -o addopts= -p no:cacheprovider -rs

  mcp-contract:
    name: mcp-contract
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, preflight]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install MCP contract dependencies
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[dev,mcp]"
      - name: Run MCP contract tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit/mcp/test_local_server.py \
            tests/unit/analytics_mcp/test_observability_mcp_tools.py -q --tb=short

  required-pr-gate:
    name: required-pr-gate
    # Single synthetic required check: the branch ruleset should require ONLY
    # `required-pr-gate` instead of the individual job contexts. This fails
    # closed on skip: `skipped` is accepted as a pass ONLY for the explicit
    # allowlist in scripts/ci/check_required_gate.py (SKIP_OK), never as a
    # blanket rule -- see that script's module docstring for the incident
    # (in TraigentBackend's own classifier) that motivated tightening this.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, schema-types, preflight, collection, unit, mcp-contract]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify required gate jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_required_gate.py
