name: SDK Required PR Gate

# Fast required gate for develop PRs + merge-queue candidates (two-tier CI
# policy, mirroring TraigentBackend): develop PRs run preflight (changed-file
# ruff) + the full unit suite (pytest -n auto via addopts); the comprehensive
# release-gate (lint-type, tests-unit, tests-integration, security, codeql)
# continues to protect main. Before this gate, develop PRs ran NO tests at all.

on:
  pull_request:
    branches: [develop, main]
    # Default types + ready_for_review so flipping a draft to ready runs the gate.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge-queue candidate refs (gh-readonly-queue/*); required checks must
  # report on the candidate commit.
  merge_group: {}

permissions:
  contents: read
  # Merge-queue attribution below reads one exact PR record. This is not used
  # on ordinary pull_request events and deliberately grants no write scope.
  pull-requests: read

concurrency:
  group: sdk-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  changes:
    name: detect-changes
    # Skip CI on draft PRs (they can't merge); merge_group always runs.
    # Downstream jobs skip and required-pr-gate still passes (skipped deps = pass).
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      py_changed: ${{ steps.changed.outputs.py_changed }}
      code_changed: ${{ steps.changed.outputs.code_changed }}
      # Total files touched by this diff range, independent of any path
      # pattern. required-pr-gate's skip verification
      # (scripts/ci/check_required_gate.py) trusts a downstream job's
      # `false` gate ONLY when this is > 0 -- a range that produced ZERO
      # files is a broken/empty range, not "nothing relevant changed", unless
      # the strict ancestry-only verifier below proves the exceptional topology.
      changed_file_count: ${{ steps.changed.outputs.changed_file_count }}
      ancestry_only: ${{ steps.changed.outputs.ancestry_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Event fields are data, not shell source. The runner materializes
          # these values before bash starts; every use below remains quoted.
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Three-dot (merge-base) range: classify only what THIS PR changes.
          # For merge_group events, classify what the queue candidate changes
          # on the base branch; FAIL CLOSED on missing shas (an empty range
          # would classify everything unchanged -> untested silent-green merge).
          if [ "$EVENT_NAME" = "merge_group" ]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
            head_sha="$MERGE_GROUP_HEAD_SHA"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::merge_group event missing base/head sha; refusing to classify"
              exit 1
            fi
            range="${base_sha}...${head_sha}"
          else
            base_sha="$PULL_REQUEST_BASE_SHA"
            head_sha="$PULL_REQUEST_HEAD_SHA"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::pull_request event missing base/head sha; refusing to classify"
              exit 1
            fi
            range="${base_sha}...${head_sha}"
          fi
          changed_files="$(git diff --name-only --diff-filter=ACMRT "$range")"

          # Emit the raw file count BEFORE any pattern filtering. Consumed by
          # required-pr-gate's classifier-gated skip verification: a job may
          # only treat its own `false` gate as trustworthy if this is > 0.
          if [ -z "$changed_files" ]; then
            changed_file_count=0
          else
            changed_file_count="$(printf '%s\n' "$changed_files" | wc -l)"
          fi
          echo "changed_file_count=${changed_file_count}" >> "$GITHUB_OUTPUT"
          # Default deny: this is flipped only after every topology, tree,
          # same-repository, and immutable-declaration check succeeds.
          echo "ancestry_only=false" >> "$GITHUB_OUTPUT"

          has_match() {
            printf '%s\n' "$changed_files" | grep -Eq "$1"
          }
          set_output_bool() {
            local name="$1"; shift
            if "$@"; then echo "${name}=true" >> "$GITHUB_OUTPUT"; else echo "${name}=false" >> "$GITHUB_OUTPUT"; fi
          }

          set_output_bool py_changed has_match '\.py$'
          set_output_bool code_changed has_match '^(traigent|traigent_validation|tests|scripts|walkthrough)/|^(pyproject\.toml|requirements[^/]*\.txt|\.github/workflows/pr-gate\.yml)'

          # A release ancestry-sync has no content diff by design, but it must
          # never turn the normal zero-diff detector into a blanket allowlist.
          # The declaration lives in the exact PR-head commit trailer rather
          # than mutable PR text. For merge-queue candidates, the candidate's
          # second parent cryptographically identifies that declared head.
          verify_declared_ancestry_head() {
            local declared_head="$1"
            local declared_tree
            local -a head_parents

            if ! git merge-base --is-ancestor "$base_sha" "$declared_head"; then
              echo "::notice::ancestry-only denied: base is not an ancestor of declared head"
              return 1
            fi
            read -r -a head_parents <<< "$(git show -s --format=%P "$declared_head")"
            if [ "${#head_parents[@]}" -ne 2 ]; then
              echo "::notice::ancestry-only denied: declared head does not have exactly two parents"
              return 1
            fi
            if [ "${head_parents[0]}" != "$base_sha" ]; then
              echo "::notice::ancestry-only denied: declared head first parent is not the exact event base"
              return 1
            fi
            if [ "${head_parents[1]}" != "$expected_main_sha" ]; then
              echo "::notice::ancestry-only denied: declared head second parent is not freshly fetched origin/main"
              return 1
            fi
            declared_tree="$(git rev-parse "${declared_head}^{tree}")"
            if [ "$declared_tree" != "$base_tree" ]; then
              echo "::notice::ancestry-only denied: declared head tree differs from event base"
              return 1
            fi
            if [ "$expected_main_tree" != "$base_tree" ]; then
              echo "::notice::ancestry-only denied: freshly fetched origin/main tree differs from event base"
              return 1
            fi
            if ! git show -s --format=%B "$declared_head" | git interpret-trailers --parse | grep -Fxq 'Traigent-Ancestry-Only: true'; then
              echo "::notice::ancestry-only denied: declared head lacks exact Traigent-Ancestry-Only trailer"
              return 1
            fi
          }

          base_tree="$(git rev-parse "${base_sha}^{tree}")"
          if ! git fetch --no-tags origin main; then
            echo "::notice::ancestry-only denied: could not fetch origin/main"
          else
            expected_main_sha="$(git rev-parse FETCH_HEAD)"
            expected_main_tree="$(git rev-parse "${expected_main_sha}^{tree}")"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              head_repo="$PULL_REQUEST_HEAD_REPO"
              if [ "$head_repo" != "$REPOSITORY" ]; then
                echo "::notice::ancestry-only denied: fork pull request"
              elif verify_declared_ancestry_head "$head_sha"; then
                echo "ancestry_only=true" >> "$GITHUB_OUTPUT"
              fi
            elif [ "$EVENT_NAME" = "merge_group" ]; then
              candidate_tree="$(git rev-parse "${head_sha}^{tree}")"
              read -r -a candidate_parents <<< "$(git show -s --format=%P "$head_sha")"
              if [ "${#candidate_parents[@]}" -ne 2 ]; then
                echo "::notice::ancestry-only denied: merge-queue candidate does not have exactly two parents"
              elif [ "${candidate_parents[0]}" != "$base_sha" ]; then
                echo "::notice::ancestry-only denied: merge-queue candidate first parent is not the exact event base"
              elif [ "$candidate_tree" != "$base_tree" ]; then
                echo "::notice::ancestry-only denied: merge-queue candidate tree differs from event base"
              else
                pr_head_sha="${candidate_parents[1]}"
                pr_head_tree="$(git rev-parse "${pr_head_sha}^{tree}")"
                if [ "$pr_head_tree" != "$base_tree" ]; then
                  echo "::notice::ancestry-only denied: candidate, declared head, and base trees must all match"
                else
                  # A queue candidate has no pull_request event payload. Its
                  # head_ref is the immutable GitHub-generated queue ref; use
                  # its one PR number to fetch and bind the API record to the
                  # candidate's second parent. Never consult mutable PR text.
                  merge_group_ref="$MERGE_GROUP_HEAD_REF"
                  if [[ ! "$merge_group_ref" =~ ^gh-readonly-queue/develop/pr-([1-9][0-9]*)-[0-9a-f]{40}$ ]]; then
                    echo "::notice::ancestry-only denied: merge-queue head_ref is not one exact develop PR reference"
                  else
                    pr_number="${BASH_REMATCH[1]}"
                    if ! pr_json="$(gh api --method GET "repos/${REPOSITORY}/pulls/${pr_number}")"; then
                      echo "::notice::ancestry-only denied: could not fetch merge-queue PR metadata"
                    elif ! pr_base_ref="$(jq -er '.base.ref' <<< "$pr_json")" || \
                        ! pr_base_sha="$(jq -er '.base.sha' <<< "$pr_json")" || \
                        ! pr_head_sha_api="$(jq -er '.head.sha' <<< "$pr_json")" || \
                        ! pr_head_repo="$(jq -er '.head.repo.full_name' <<< "$pr_json")"; then
                      echo "::notice::ancestry-only denied: merge-queue PR metadata is incomplete"
                    elif [ "$pr_base_ref" != "develop" ] || \
                        [ "$pr_base_sha" != "$base_sha" ] || \
                        [ "$pr_head_sha_api" != "$pr_head_sha" ] || \
                        [ "$pr_head_repo" != "$REPOSITORY" ]; then
                      echo "::notice::ancestry-only denied: merge-queue PR metadata does not exactly match candidate"
                    elif verify_declared_ancestry_head "$pr_head_sha"; then
                      echo "ancestry_only=true" >> "$GITHUB_OUTPUT"
                    fi
                  fi
                fi
              fi
            else
              echo "::notice::ancestry-only denied: unsupported event"
            fi
          fi

  schema-types:
    name: schema-types
    # The FIRST real gate (mirrors traigent-js's test:ci, where
    # check:schema-types is literally the first command) — deliberately not
    # gated on `changes` output or fork-safety like `unit`/`mcp-contract`:
    # traigent/generated/schema_types.py can drift for reasons invisible to
    # this repo's own diff (the pinned TraigentSchema commit moves, or someone
    # hand-edits the committed file), so it always runs.
    #
    # The same-repo condition below is now stricter than this job needs:
    # TraigentSchema is PUBLIC and the checkout is credential-free, so nothing
    # here requires a secret. The condition is left in place because relaxing it
    # would start running this job on fork PRs, which is a separate decision
    # about fork CI rather than part of this fix. Fork PRs skip it and
    # `required-pr-gate` treats skipped as passing (see that job's comment).
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned TraigentSchema revision this generator reads from. Bump this
      # SHA deliberately (in the same PR that regenerates
      # traigent/generated/schema_types.py) when TraigentSchema changes need
      # to land here — never track a moving branch, or this gate becomes
      # time-dependent (see tools/spine-trail memory on time-dependent gates).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: Traigent/TraigentSchema
          ref: 43b20f725f5c912501a852c21ff34ada3d40e6d1
          path: TraigentSchema
          # No `token:` here on purpose. Traigent/TraigentSchema is PUBLIC, so
          # this clone needs no credential -- verified with an anonymous
          # `git ls-remote` against it. Passing a secret that resolves to an
          # empty string is strictly worse than passing nothing: actions/checkout
          # treats a declared-but-empty input as a hard error ("Input required
          # and not supplied: token") instead of falling back to the default.
          #
          # That is exactly what broke every Dependabot PR in this repo.
          # Dependabot runs read from a SEPARATE secret store, so the
          # TRAIGENT_* names -- which live only in the Actions store -- resolved
          # to empty, checkout refused to start, schema-types failed, and
          # required-pr-gate (an aggregator) failed with it.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check generated schema types are current
        env:
          TRAIGENT_SCHEMA_REPO: ${{ github.workspace }}/TraigentSchema
        run: python scripts/generate_schema_types.py --check

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Pin to the exact version declared in pyproject.toml's `dev` extra
          # (issue #1550) — installing unpinned `ruff` here let upstream
          # releases retroactively fail preflight on pre-existing lint debt
          # in unrelated PRs (e.g. PR #1540). pyproject.toml is the single
          # source of truth; bump the pin there, not here.
          ruff_version="$(python scripts/ci/get_ruff_pin.py)"
          echo "Pinning preflight ruff to ${ruff_version} (from pyproject.toml)"
          pip install "ruff==${ruff_version}"
      - name: Run changed-file Ruff checks
        shell: bash
        env:
          PY_CHANGED: ${{ needs.changes.outputs.py_changed }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$PY_CHANGED" != "true" ]; then
            echo "No Python files changed; skipping Ruff preflight."
            exit 0
          fi
          if [ "$EVENT_NAME" = "merge_group" ]; then
            range="${MERGE_GROUP_BASE_SHA}...${MERGE_GROUP_HEAD_SHA}"
          else
            range="${PULL_REQUEST_BASE_SHA}...${PULL_REQUEST_HEAD_SHA}"
          fi
          changed_py="$(git diff --name-only --diff-filter=ACMRT "$range" -- '*.py')"
          printf '%s\n' "$changed_py" | xargs -r ruff check --output-format=github
          printf '%s\n' "$changed_py" | xargs -r ruff format --check

      # Whole-repo syntax check. The style lint above is diff-scoped and the
      # workflow-level `ruff check` runs cover only traigent/ and
      # traigent_validation/, so a file outside those trees that nobody edits
      # is linted by nothing -- which is how a plain IndentationError sat in
      # plugins/traigent-ui/traigent_ui/optimization_storage.py on both
      # develop and main. E9 is syntax/IO errors only: it adds no style
      # pressure and cannot be tripped by the 900+ pre-existing style
      # findings under plugins/.
      - name: Syntax check (whole repo)
        run: ruff check . --select E9 --no-cache --output-format=github

  unit:
    name: unit
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, preflight]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sdk-pr-gate-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sdk-pr-gate-
            ${{ runner.os }}-pip-
      - name: Install test deps
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[all,dev]"
          pip install "redis>=8,<9"
      - name: Verify redis-py 8
        run: |
          python -c 'import redis; major = int(redis.__version__.split(".", 1)[0]); print(f"redis-py {redis.__version__} (major {major})"); assert major == 8, redis.__version__'
      - name: Install pinned economics Schema contract
        # The economics contract-drift tests (tests/unit/economics) hard-require
        # the exact TraigentSchema economics contract and must not silently
        # skip. traigent-schema 5.0.0 is not on PyPI, so install it from the
        # pinned commit in scripts/ci/schema-pin.txt -- the single source of
        # truth, shared with publish.yml. Restamp the SHA in that file only.
        #
        # Credential-free on purpose: TraigentSchema is a PUBLIC repo, so no
        # token is required to resolve this pin. Injecting one into the pip URL
        # (as publish.yml still does) risked leaking it -- pip echoes the
        # requirement string on failure and caches it -- and it broke every
        # Dependabot PR, which never receives org secrets.
        run: |
          pip install -r scripts/ci/schema-pin.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
          # This lane installs the pinned economics Schema above, so a missing
          # traigent_schema here means the install step broke — not that the
          # developer lacks a token. Setting this turns the module-level skip in
          # tests/unit/economics/test_schema.py into a hard failure, so a broken
          # install can never downgrade the contract lane to a silent green.
          # Variable name is defined once in tests/unit/economics/conftest.py as
          # REQUIRE_SCHEMA_ENV; keep the two in sync.
          TRAIGENT_REQUIRE_ECONOMICS_SCHEMA: "1"
        # pyproject addopts already include -n auto --dist loadgroup (xdist).
        run: pytest tests/unit -q --tb=short
      - name: Run live Redis session test
        env:
          PYTHONPATH: .
          TRAIGENT_TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest tests/integration/test_session_manager_live_redis.py -q --tb=short

  collection:
    name: collection
    # Deliberately NOT gated on head.repo == github.repository: this job needs no
    # secrets, so it must protect fork PRs too. `unit` and `mcp-contract` cannot,
    # because they install a token-gated dependency.
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    # A collection hang is the failure mode this job exists to catch, so cap it
    # low: import-time-only work that measures ~11s locally must never sit in the
    # queue. Any future import-time hang fails loudly instead of stalling.
    timeout-minutes: 10
    needs: [changes, preflight]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        # NOTE: the pinned economics Schema is deliberately NOT installed here
        # (unlike the `unit` job). That is the point of this job: it reproduces
        # the environment every local developer actually has — one where the
        # traigent-schema git pin has not been installed (it is not on PyPI and
        # not in any extra) — and proves the whole suite still *collects* there. It also exercises the module-level skip
        # in tests/unit/economics/test_schema.py, which would otherwise never run
        # in CI and could rot unnoticed. Do not add the schema install here.
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[all,dev]"
      - name: Verify the whole test suite collects
        env:
          PYTHONPATH: .
          TRAIGENT_MOCK_LLM: "true"
          TRAIGENT_OFFLINE_MODE: "true"
        # Pass/fail is the exit code alone: --collect-only exits 2 on any
        # collection error and 0 when clean. No output grep and no pinned test
        # count, so this cannot go stale as tests are added.
        #
        # `-o addopts=` clears pyproject's addopts on purpose. Those addopts
        # --ignore three paths for *runtime* reasons (hangs); ignoring them here
        # would let their imports rot invisibly, which is the exact class of
        # false-green this gate exists to prevent. Clearing addopts also drops
        # xdist, which collection does not need.
        #
        # `-rs` keeps optional-dependency skips visible in the log, so a skip
        # that starts hiding something is noticeable in review.
        run: |
          pytest --collect-only -q tests/ -o addopts= -p no:cacheprovider -rs

  mcp-contract:
    name: mcp-contract
    if: ${{ !cancelled() && needs.changes.outputs.code_changed == 'true' && needs.preflight.result == 'success' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, preflight]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install MCP contract dependencies
        run: |
          bash scripts/ci/install_sdk_requirements.sh -e ".[dev,mcp]"
      - name: Run MCP contract tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit/mcp/test_local_server.py \
            tests/unit/analytics_mcp/test_observability_mcp_tools.py -q --tb=short

  required-pr-gate:
    name: required-pr-gate
    # Single synthetic required check: the branch ruleset should require ONLY
    # `required-pr-gate` instead of the individual job contexts. This fails
    # closed on skip: `skipped` is accepted as a pass ONLY for the explicit
    # allowlist in scripts/ci/check_required_gate.py (SKIP_OK), never as a
    # blanket rule -- see that script's module docstring for the incident
    # (in TraigentBackend's own classifier) that motivated tightening this.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, schema-types, preflight, collection, unit, mcp-contract]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify required gate jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_required_gate.py
