name: Publish to PyPI

on:
  # Auto-publish when a version tag is pushed (e.g. v0.10.0)
  push:
    tags:
      - "v*"

  # Keep manual dispatch as fallback (e.g. for TestPyPI)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      confirm_publish:
        description: 'Set to true to allow publishing'
        required: true
        default: false
        type: boolean

# Cancel in-flight runs when a new commit lands on the same ref.
# Mostly defensive: this workflow fires on tag pushes which are rare,
# but back-to-back retags or workflow_dispatch invocations shouldn't
# stack.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Run if: tag push OR manual dispatch with confirmation
    if: startsWith(github.ref, 'refs/tags/v') || inputs.confirm_publish
    environment: ${{ (github.event_name == 'push' && 'pypi') || inputs.environment || 'pypi' }}
    outputs:
      package_version: ${{ steps.package_version.outputs.package_version }}
    permissions:
      id-token: write  # For trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0  # Full history for version detection

    - name: Verify tag is on main branch
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GIT_SHA: ${{ github.sha }}
        GIT_REF_NAME: ${{ github.ref_name }}
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor "$GIT_SHA" origin/main; then
          echo "Error: tag $GIT_REF_NAME is not on the main branch. Only tag from main."
          exit 1
        fi
        echo "Tag $GIT_REF_NAME is on main — proceeding."

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Read package version
      id: package_version
      run: |
        VERSION=$(python - <<'PY'
        import tomllib

        with open("pyproject.toml", "rb") as handle:
            print(tomllib.load(handle)["project"]["version"])
        PY
        )
        echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Verify version consistency
      env:
        VERSION_PYPROJECT: ${{ steps.package_version.outputs.package_version }}
      run: |
        echo "pyproject.toml version: $VERSION_PYPROJECT"

        # If triggered by a tag, verify the tag matches the package version
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Git tag version: $TAG_VERSION"
          if [ "$TAG_VERSION" != "$VERSION_PYPROJECT" ]; then
            echo "Error: Git tag v$TAG_VERSION does not match package version $VERSION_PYPROJECT"
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches package version $VERSION_PYPROJECT"
        fi

    - name: Install package and dev dependencies
      run: |
        python -m pip install -e ".[dev,all]"

    - name: Install pinned economics Schema contract
      # tests/unit/economics hard-requires the exact traigent-schema economics
      # contract (traigent/economics/schema.py fingerprints it and fails closed
      # with EconomicsSchemaUnavailable when it is absent). traigent-schema
      # 5.0.0 is not on PyPI — the newest published there is 4.8.0 — so it must
      # come from the pinned commit, and `pip install -e ".[dev,all]"` above does
      # not bring it in. pr-gate.yml installs it explicitly for the same reason;
      # the publish lane must match, or main stays green on PRs and red here.
      # That gap is what blocked v0.26.0, the first release to ship
      # traigent/economics/.
      #
      # The pin lives in scripts/ci/schema-pin.txt rather than pyproject.toml,
      # because PyPI rejects direct URL references in package metadata even
      # inside an optional extra — see that file's header for the full history.
      #
      # Credential-free: TraigentSchema is a PUBLIC repository, so this pin needs
      # no token. The previous version required one and hard-failed the release
      # without it ("TraigentSchema is private..."), which was false — and a
      # release lane that refuses to run on a missing secret it does not actually
      # need is an outage waiting for the day that secret expires. Injecting a
      # token into the pip URL was also a small leak risk: pip echoes the
      # requirement string on failure and caches it. pr-gate.yml made the same
      # change and its `unit` job passes against this exact pin.
      run: |
        pip install -r scripts/ci/schema-pin.txt
        # Fail here with one clear message rather than as ~80 opaque test errors.
        python -c "import traigent_schema; print('traigent_schema is importable')"

    - name: Run tests before publishing
      env:
        TRAIGENT_MOCK_LLM: true
        TRAIGENT_OFFLINE_MODE: true
        PYTHONPATH: .
        # The step above installs the pinned economics Schema, so a missing
        # traigent_schema here means that install broke — not that a developer
        # lacks a token. This turns the module-level skip in
        # tests/unit/economics/test_schema.py into a hard failure, so a broken
        # install can never downgrade the publish gate to a silent green.
        # Mirrors pr-gate.yml; the name is defined once in
        # tests/unit/economics/conftest.py as REQUIRE_SCHEMA_ENV.
        TRAIGENT_REQUIRE_ECONOMICS_SCHEMA: "1"
      run: |
        pytest tests/unit/ -v --tb=short

    - name: Run example smoke before publishing
      env:
        TRAIGENT_MOCK_LLM: "true"
        TRAIGENT_OFFLINE_MODE: "true"
        TRAIGENT_COST_APPROVED: "true"
        # 0.12.0 added a CI/CD run-approval gate (TRAIGENT_RUN_APPROVED); examples
        # run in mock+offline mode (zero spend), so approve this controlled release smoke.
        TRAIGENT_RUN_APPROVED: "1"
        TRAIGENT_APPROVED_BY: "ci-release-smoke"
        # examples load shared fixtures from examples/datasets/, outside each
        # example dir; 0.12.0's dataset-path containment needs the root widened
        # to the examples tree for the smoke.
        TRAIGENT_DATASET_ROOT: "${{ github.workspace }}/examples"
        ANTHROPIC_API_KEY: "sk-ant-test-mock-key-for-ci" # pragma: allowlist secret
        OPENAI_API_KEY: "sk-openai-test-mock-key-for-ci" # pragma: allowlist secret
        TRAIGENT_API_KEY: "test-traigent-api-key-for-ci" # pragma: allowlist secret
      run: |
        bash examples/test_all_examples.sh quickstart
        bash examples/test_all_examples.sh docs
        bash examples/test_all_examples.sh core

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Test installation from built package
      run: |
        pip install dist/*.whl
        python -c "import traigent; print(f'Package test: traigent v{traigent.__version__} imported successfully')"

    # Publish to Test PyPI (manual dispatch only)
    - name: Publish to Test PyPI
      if: github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi'
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true

    # Publish to production PyPI (automatic on tag push, or manual dispatch)
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi')
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        verbose: true

    - name: Create deployment summary
      if: always()
      env:
        ENVIRONMENT: ${{ (github.event_name == 'push' && 'pypi (auto from tag)') || inputs.environment || 'unknown' }}
        TRIGGER: ${{ github.event_name }}
        REF: ${{ github.ref }}
        JOB_STATUS: ${{ job.status }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import re

        import traigent


        def markdown_value(value: str, *, default: str = "unknown") -> str:
            normalized = re.sub(r"[^A-Za-z0-9 ._:/+\-]", " ", value or default).strip()
            return normalized[:160] or default


        summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
        lines = [
            "## Deployment Summary",
            f"- **Version**: {markdown_value(traigent.__version__)}",
            f"- **Environment**: {markdown_value(os.environ.get('ENVIRONMENT', 'unknown'))}",
            f"- **Trigger**: {markdown_value(os.environ.get('TRIGGER', 'unknown'))}",
            f"- **Ref**: {markdown_value(os.environ.get('REF', 'unknown'))}",
            f"- **Status**: {markdown_value(os.environ.get('JOB_STATUS', 'unknown'))}",
            "",
        ]
        with summary.open("a", encoding="utf-8") as handle:
            handle.write("\n".join(lines))
        PY

  verify-publication:
    needs: publish
    runs-on: ubuntu-latest
    if: always() && needs.publish.result == 'success'

    steps:
    - name: Wait for package propagation
      run: sleep 300

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Test installation from PyPI
      env:
        EXPECTED_VERSION: ${{ needs.publish.outputs.package_version }}
        PUBLISH_ENVIRONMENT: ${{ inputs.environment || 'pypi' }}
      run: |
        if [ "$PUBLISH_ENVIRONMENT" = "testpypi" ]; then
          PACKAGE_LABEL="TestPyPI"
          PACKAGE_API_URL="https://test.pypi.org/pypi/traigent/json"
          INSTALL_ARGS=(--index-url "https://test.pypi.org/simple/" --extra-index-url "https://pypi.org/simple/")
        else
          PACKAGE_LABEL="PyPI"
          PACKAGE_API_URL="https://pypi.org/pypi/traigent/json"
          INSTALL_ARGS=()
        fi

        VERSION="$EXPECTED_VERSION"
        echo "Testing installation of traigent==$VERSION from $PACKAGE_LABEL"

        # Retry API check up to 5 times (CDN propagation can be slow)
        for attempt in 1 2 3 4 5; do
          echo "Attempt $attempt: checking $PACKAGE_LABEL API for version $VERSION..."
          HTTP_CODE=$(curl -sL -w '%{http_code}' -o /tmp/pypi_response.json "$PACKAGE_API_URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ] && CHECK_VERSION="$VERSION" python -c "
        import json, os, sys
        with open('/tmp/pypi_response.json') as f:
            data = json.load(f)
        version = os.environ['CHECK_VERSION']
        releases = data.get('releases', {})
        if version not in releases or not releases[version]:
            sys.exit(1)
        print(f'Verified version {version} exists on package index')
        "
          then
            break
          fi
          if [ "$attempt" -lt 5 ]; then
            echo "Version not found yet (HTTP $HTTP_CODE), waiting 60s before retry..."
            sleep 60
          else
            echo "Error: version $VERSION not found on $PACKAGE_LABEL after 5 attempts"
            exit 1
          fi
        done

        # Create clean environment and test installation
        python -m venv test_env
        source test_env/bin/activate
        pip install --upgrade pip

        # Retry pip install up to 5 times (CDN propagation can lag behind the API)
        for install_attempt in 1 2 3 4 5; do
          echo "Install attempt $install_attempt: pip install traigent==$VERSION..."
          if pip install "${INSTALL_ARGS[@]}" "traigent==$VERSION"; then
            echo "Package installed successfully"
            break
          fi
          if [ "$install_attempt" -lt 5 ]; then
            echo "Install failed (CDN not ready), waiting 60s before retry..."
            sleep 60
          else
            echo "Error: pip install traigent==$VERSION failed after 5 attempts"
            exit 1
          fi
        done

        # Test basic import
        python -c "import traigent; print(f'Successfully installed and imported traigent v{traigent.__version__}')"

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Package successfully published and verified on PyPI!" >> "$GITHUB_STEP_SUMMARY"
        echo "Users can now install with: \`pip install traigent\`" >> "$GITHUB_STEP_SUMMARY"

  # GitHub Latest drifted from PyPI (stuck at v0.12.0 while PyPI reached
  # v0.27.0) because no job in this workflow ever creates a GitHub Release.
  # This job closes that gap for the automatic, tag-triggered publish path:
  # it creates (or, on a rerun, idempotently updates) the Release for the
  # exact tag that was just verified on PyPI, then asserts the tag, the
  # published PyPI version, and GitHub's "Latest" all agree.
  github-release:
    needs: [publish, verify-publication]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.verify-publication.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi'))
    # Minimum permission beyond the workflow-level `contents: read`: this job
    # is the only one that writes a GitHub Release.
    permissions:
      contents: write
    env:
      # Derived from the published package version (the same source
      # verify-publication uses to confirm PyPI), not github.ref: a
      # workflow_dispatch production-PyPI publish (roughly as common in this
      # repo's history as a tag push) never sets github.ref to a tag, so a
      # ref-derived tag would be wrong or empty for that path.
      TAG: v${{ needs.publish.outputs.package_version }}
      REPO: ${{ github.repository }}
      EXPECTED_VERSION: ${{ needs.publish.outputs.package_version }}
      # `gh` reads GH_TOKEN directly, so this covers every step in the job
      # without a login step. Preferred over `gh auth login --with-token`,
      # which writes the credential to ~/.config/gh/hosts.yml on the runner --
      # a credential at rest for the life of the job, where this is only ever
      # in the process environment. Actions masks the value in logs either way.
      GH_TOKEN: ${{ github.token }}

    steps:
    # A workflow_dispatch->pypi publish never sets github.ref to a tag, so the
    # `publish` job's "Verify tag is on main" step (gated on
    # startsWith(github.ref, 'refs/tags/v')) is SKIPPED on that path. Without
    # this check, dispatching from a feature branch would mint a v<version> git
    # tag on that commit (--target $GITHUB_SHA) and mark it Latest -- publishing
    # to PyPI from a branch was already possible, but the tag + Latest side
    # effect would be new. Uses the API rather than a checkout: this job has
    # none, and adding one to run `git merge-base` would be a bigger change than
    # the check.
    - name: Verify the release commit is on main
      run: |
        set -euo pipefail
        STATUS="$(gh api "repos/$REPO/compare/main...$GITHUB_SHA" --jq .status)"
        echo "compare main...$GITHUB_SHA -> $STATUS"
        case "$STATUS" in
          identical|behind) ;;
          *)
            echo "::error::Refusing to create release $TAG: $GITHUB_SHA is not on main ($STATUS)."
            exit 1
            ;;
        esac

    # The step above validates $GITHUB_SHA. It says nothing about where $TAG
    # points, and `gh release create` REUSES an existing tag rather than
    # repointing it -- so a workflow_dispatch can publish version X built from
    # commit B while refs/tags/vX still points at commit A, and the Release
    # (plus everything downstream that trusts "the tag for vX") would be cut
    # against a commit this run never verified. Name parity is not identity.
    - name: Verify an existing tag points at the published commit
      run: |
        set -euo pipefail
        # Distinguish a CONFIRMED 404 (the tag genuinely does not exist yet,
        # which is the normal workflow_dispatch path) from any other failure.
        # The first version used `|| true` and treated empty output as
        # "absent", so a transient transport error silently skipped identity
        # verification entirely -- a policy check failing OPEN, which is the
        # one direction this guard must never fail.
        TAG_ERR="${RUNNER_TEMP:-/tmp}/tag-ref-$$.err"
        set +e
        REF_JSON="$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>"$TAG_ERR")"
        ref_rc=$?
        set -e
        if [ "$ref_rc" -ne 0 ]; then
          if grep -qi 'HTTP 404' "$TAG_ERR"; then
            echo "No existing $TAG; it will be created at $GITHUB_SHA."
            exit 0
          fi
          echo "::error::Could not determine whether $TAG already exists (gh exited ${ref_rc}). Refusing to cut a release without verifying the tag's identity."
          cat "$TAG_ERR" >&2
          exit 1
        fi
        if [ -z "$REF_JSON" ]; then
          echo "::error::Tag lookup for $TAG succeeded but returned nothing; refusing to proceed on an unverifiable result."
          exit 1
        fi
        OBJ_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
        OBJ_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
        # A null/absent sha means the response was not the shape we expect
        # (a 404 body echoed to stdout, an error envelope, a schema change).
        # Never read that as "no existing tag".
        if [ -z "$OBJ_SHA" ] || [ "$OBJ_SHA" = "null" ]; then
          echo "::error::Tag lookup for $TAG returned no object sha; refusing to proceed on an unverifiable result."
          printf '%s\n' "$REF_JSON" >&2
          exit 1
        fi
        if [ "$OBJ_TYPE" = "tag" ]; then
          # Annotated tag: peel it to the commit it wraps.
          OBJ_SHA="$(gh api "repos/$REPO/git/tags/$OBJ_SHA" --jq '.object.sha')"
        fi
        if [ "$OBJ_SHA" != "$GITHUB_SHA" ]; then
          echo "::error::$TAG already points at $OBJ_SHA, but this run published $GITHUB_SHA. Refusing to publish against an unverified commit."
          exit 1
        fi
        echo "$TAG already points at $GITHUB_SHA."

    - name: Create or update the GitHub Release for this tag
      run: |
        set -euo pipefail

        echo "Generating release notes for $TAG..."
        # target_commitish covers the workflow_dispatch case, where $TAG has
        # no matching git tag yet: it tells the API which commit the
        # (about-to-be-minted) tag will point at, so notes are generated
        # against the right point in history instead of the default branch.
        gh api "repos/$REPO/releases/generate-notes" \
          -f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA" \
          > /tmp/generated-notes.json

        python - <<'PY'
        import json

        with open("/tmp/generated-notes.json", encoding="utf-8") as handle:
            data = json.load(handle)

        with open("/tmp/release-title.txt", "w", encoding="utf-8") as handle:
            handle.write(data.get("name") or "")
        with open("/tmp/release-body.md", "w", encoding="utf-8") as handle:
            handle.write(data.get("body") or "")
        PY

        TITLE="$(cat /tmp/release-title.txt)"
        if [ -z "$TITLE" ]; then
          TITLE="$TAG"
        fi

        # NOTE on --latest below: it FORCES this release to be GitHub's
        # "Latest", which is correct for a forward publish (every release this
        # repo has made) but wrong for a backport -- publishing 0.11.5 after
        # 0.12.0 would move the Latest badge backwards. The assertion step
        # cannot catch that, because it checks Latest == TAG and --latest is
        # what just made that true. Deliberately not guarded with a version
        # comparison here: `gh release list` failing under `set -euo pipefail`
        # would abort this job AFTER PyPI has published, which is a worse
        # failure than the case it would prevent. If we ever ship a backport,
        # pass --latest=false for it.
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          # Idempotent rerun (e.g. a retried workflow_dispatch of this job,
          # or a manually re-triggered run for the same tag): update the
          # existing release instead of failing on "already exists".
          echo "Release $TAG already exists — updating it."
          gh release edit "$TAG" --repo "$REPO" \
            --title "$TITLE" \
            --notes-file /tmp/release-body.md \
            --latest
        else
          # --target mints the tag from this run's commit when it doesn't
          # exist yet (the workflow_dispatch-to-pypi path never pushed one);
          # for a real tag push the tag already exists at this commit, so
          # --target has no effect there and gh just uses the existing tag.
          echo "Creating release $TAG."
          gh release create "$TAG" --repo "$REPO" \
            --title "$TITLE" \
            --notes-file /tmp/release-body.md \
            --latest \
            --target "$GITHUB_SHA"
        fi

    - name: Assert GitHub Latest, the tag, and PyPI agree
      run: |
        set -euo pipefail

        TAG_VERSION="${TAG#v}"
        if [ "$TAG_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "Error: tag $TAG (version $TAG_VERSION) does not match the published package version $EXPECTED_VERSION"
          exit 1
        fi

        LATEST_TAG="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
        if [ "$LATEST_TAG" != "$TAG" ]; then
          echo "Error: GitHub Latest release is $LATEST_TAG, expected $TAG"
          exit 1
        fi

        echo "GitHub Latest ($LATEST_TAG), tag ($TAG), and PyPI ($EXPECTED_VERSION) agree."
