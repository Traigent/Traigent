name: Protected Target Authorization

# This workflow deliberately uses pull_request_target and never checks out or
# executes pull-request code. The workflow definition is read from the trusted
# base branch, so a contributor cannot rewrite the gate in their own PR.
#
# Two principals may target a protected branch:
#
#   1. The Principal Engineer, unconditionally.
#   2. Dependabot, ONLY for pull requests whose entire diff is dependency
#      manifests, OR whose workflow-file changes are action-version bumps and
#      nothing else. A workflow file is admitted only when EVERY changed line in
#      it is a `uses:` action reference -- which is exactly the shape of a
#      `github-actions` ecosystem bump. A changed `run:`, `if:`, `permissions:`,
#      `env:` or `on:` line still requires the Principal Engineer, because those
#      alter what CI executes or with what privileges. The `docker` ecosystem
#      remains Principal-only: a Dockerfile has no equivalent line-level shape
#      that separates a base-image pin from a build instruction.
#
# The Dependabot lane is fail-closed: every identity condition must hold AND
# every changed path must match the allowlist. Any API error, any unrecognised
# path, or a diff too large to enumerate denies the pull request.
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  principal-target-authorization:
    name: principal-target-authorization
    runs-on: ubuntu-latest
    steps:
      - name: Authorize the author of this protected-target pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          # github.actor is the account whose privileges the run carries. On a
          # re-run it stays the original actor, so it cannot be swapped by
          # re-running someone else's workflow. Do not substitute
          # github.triggering_actor here.
          TRIGGERING_ACTOR: ${{ github.actor }}
          PRINCIPAL_ENGINEER: nimrodbusany
          DEPENDABOT: 'dependabot[bot]'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A merge-group commit is created only after the PR-level required
          # checks passed, and its event carries no pull-request author, so the
          # context is reproduced here to keep the same required-check name.
          #
          # INVARIANT: this is sound only while `principal-target-authorization`
          # remains a REQUIRED status check at the pull-request level. If it is
          # ever dropped from the branch ruleset's required checks, this early
          # exit becomes fail-open and must be revisited.
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "merge_group event: the pull-request-level gate already passed."
            exit 0
          fi

          # ---- Lane 1: the Principal Engineer, unconditionally. ----
          if [ "$PR_AUTHOR" = "$PRINCIPAL_ENGINEER" ]; then
            echo "Authorized: pull request authored by the Principal Engineer."
            exit 0
          fi

          # ---- Lane 2: Dependabot, manifest-only. Fail closed. ----
          deny() {
            echo "::error::Protected-target authorization denied: $1"
            echo "Protected branches accept pull requests from the Principal Engineer,"
            echo "or from Dependabot when the diff is limited to dependency manifests."
            echo "Author: $PR_AUTHOR (type ${PR_AUTHOR_TYPE:-unknown})"
            exit 1
          }

          if [ "$PR_AUTHOR" != "$DEPENDABOT" ]; then
            deny "author is neither the Principal Engineer nor Dependabot."
          fi

          # Identity must be corroborated, not taken from the login alone.
          if [ "$PR_AUTHOR_TYPE" != "Bot" ]; then
            deny "author claims to be Dependabot but the account type is '$PR_AUTHOR_TYPE', not 'Bot'."
          fi

          # A fork head would let an outside branch ride a Dependabot-authored
          # pull request.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            deny "head branch lives in '$HEAD_REPO', not in '$BASE_REPO'."
          fi

          # A repository writer can push commits onto a Dependabot branch while
          # the pull-request author stays Dependabot. Requiring the acting
          # identity closes that path: only Dependabot itself or the Principal
          # Engineer may drive this lane.
          if [ "$TRIGGERING_ACTOR" != "$DEPENDABOT" ] && [ "$TRIGGERING_ACTOR" != "$PRINCIPAL_ENGINEER" ]; then
            deny "acting identity '$TRIGGERING_ACTOR' is neither Dependabot nor the Principal Engineer; the branch was advanced by another account."
          fi

          # The pull-request files API returns at most 3000 files. A diff beyond
          # that cannot be fully enumerated, so it cannot be proven safe.
          if [ -z "${PR_CHANGED_FILES:-}" ]; then
            deny "changed-file count unavailable; cannot prove the diff is manifest-only."
          fi
          if [ "$PR_CHANGED_FILES" -gt 3000 ]; then
            deny "diff spans $PR_CHANGED_FILES files, beyond the 3000-file API ceiling; cannot be enumerated."
          fi

          # Enumerate the diff over the API. No checkout: pull-request code is
          # never fetched and never executed by this workflow.
          if ! files="$(gh api --paginate "repos/$BASE_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
            deny "could not list changed files; refusing to authorize without the diff."
          fi

          if [ -z "$files" ]; then
            deny "the API reported no changed files; refusing to authorize an unverifiable diff."
          fi

          seen="$(printf '%s\n' "$files" | grep -c . || true)"
          if [ "$seen" -ne "$PR_CHANGED_FILES" ]; then
            deny "enumerated $seen files but the pull request reports $PR_CHANGED_FILES; the diff was not fully retrieved."
          fi

          # ---- Workflow lane: action-version bumps, verified line by line. ----
          #
          # A `github-actions` ecosystem bump changes one thing per hunk: a
          # `uses:` reference. Anything else in a workflow file -- a `run:`
          # body, an `if:` condition, a `permissions:` grant, an `env:` value,
          # an `on:` trigger -- changes what CI executes or with what
          # privileges, and stays Principal-only.
          #
          # So the path is not the unit of authorization here; the LINE is.
          # Every added and removed line in a workflow path must be a `uses:`
          # reference or the whole pull request is denied. This is fail-closed
          # in each direction: a status other than `modified` (added, removed,
          # renamed) cannot be line-verified and denies; a missing hunk denies;
          # a hunk the second API call did not return denies at the allowlist
          # below, because the path never reaches `verified_workflows`.
          verified_workflows=""
          touches_workflow=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*|.github/actions/*) touches_workflow=1 ;;
            esac
          done <<< "$files"

          if [ "$touches_workflow" -eq 1 ]; then
            # @tsv escapes newlines and tabs, so each file is one record even
            # though a patch is multi-line. `printf %b` reverses it below.
            if ! records="$(gh api --paginate "repos/$BASE_REPO/pulls/$PR_NUMBER/files" \
                  --jq '.[] | [.filename, .status, (.patch // "")] | @tsv')"; then
              deny "could not read the diff hunks; refusing to authorize a workflow change without them."
            fi
            if [ -z "$records" ]; then
              deny "the API returned no diff hunks; a workflow change cannot be line-verified."
            fi

            # Tab is an IFS whitespace character, so `read -r a b c` would
            # COLLAPSE adjacent tabs and shift the fields when one is empty.
            # Split the record explicitly so an empty status stays empty and is
            # rejected below rather than silently taking the patch's place.
            while IFS= read -r record; do
              [ -z "$record" ] && continue
              name="${record%%$'\t'*}"
              rest="${record#*$'\t'}"
              status="${rest%%$'\t'*}"
              patch="${rest#*$'\t'}"
              case "$name" in
                .github/workflows/*|.github/actions/*) ;;
                *) continue ;;
              esac

              if [ "$status" != "modified" ]; then
                deny "workflow path '$name' has status '$status'; only an in-place modification can be line-verified."
              fi
              if [ -z "$patch" ]; then
                deny "workflow path '$name' carries no diff hunk; its changed lines cannot be verified."
              fi

              bad=0
              while IFS= read -r line; do
                case "$line" in
                  '+++'*|'---'*|'@@'*|'\'*|' '*|'') continue ;;
                  '+'*|'-'*) ;;
                  *) continue ;;
                esac
                body="${line#?}"
                if ! printf '%s\n' "$body" | grep -Eq '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]]+@[^[:space:]]+[[:space:]]*(#.*)?$'; then
                  echo "::error file=$name::changed line is not a uses: action reference -- $body"
                  bad=$((bad + 1))
                fi
              done <<< "$(printf '%b' "$patch")"

              if [ "$bad" -gt 0 ]; then
                deny "$bad changed line(s) in '$name' are not uses: action references; a workflow change beyond an action pin requires the Principal Engineer."
              fi
              verified_workflows="$(printf '%s\n%s' "$verified_workflows" "$name")"
            done <<< "$records"
          fi

          # Allowlist: dependency manifests for the `pip` ecosystem, plus the
          # workflow paths the lane above verified line by line.
          #
          # Deliberately excluded, and therefore denied by omission:
          #   Dockerfile*                               (docker ecosystem)
          #   setup.py, setup.cfg, Makefile, *.sh, scripts/**
          # Those execute at build or install time, so a bumped pin there is a
          # code-execution change, not a dependency change.
          violations=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              pyproject.toml|uv.lock|requirements.txt) ;;
              requirements/*.txt) ;;
              constraints.txt|constraints-*.txt) ;;
              .github/workflows/*|.github/actions/*)
                # Admitted only if the lane above put it in verified_workflows.
                if ! printf '%s\n' "$verified_workflows" | grep -Fxq -- "$f"; then
                  echo "::error file=$f::workflow path was not line-verified as a uses:-only change"
                  violations=$((violations + 1))
                fi
                ;;
              *)
                echo "::error file=$f::path is outside the Dependabot manifest allowlist"
                violations=$((violations + 1))
                ;;
            esac
          done <<< "$files"

          if [ "$violations" -gt 0 ]; then
            deny "$violations of $seen changed path(s) are outside the allowlist. Dependabot pull requests that touch Dockerfiles or build scripts, or that change a workflow line other than a uses: action reference, require the Principal Engineer."
          fi

          echo "Authorized: Dependabot pull request, $seen path(s) verified (manifests, and workflow files whose every changed line is a uses: reference)."
