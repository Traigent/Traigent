name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Disable concurrency to prevent job cancellation issues
# Each PR gets its own run without interference
concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  sonarcloud:
    name: SonarCloud
    # Public repos only: SonarCloud is quota-blocked (403) on private/internal
    # repos, and the self-hosted "SonarQube Quality Gate" (sonarqube-local.yml)
    # is the gate there. Skip cleanly when the repo is private. (Mirrors the
    # same fix already applied to traigent-smartopt and traigent-js.)
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Job-level timeout
    # Surface SONAR_TOKEN at job scope so the scan step can detect when it is
    # unavailable. Dependabot-triggered runs and PRs from forks do NOT receive
    # repository Actions secrets, so the token is empty there and the upstream
    # `sonar-scanner` aborts with "Project not found" (exit code 3). In that
    # case we skip the upload instead of failing the gate; unit tests and
    # coverage above still run. Analysis is unaffected on pushes to main and on
    # same-repo human PRs, where the token is present. Mirrors the capability-
    # detect-then-skip pattern already used by the codeql job in release-review.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Shallow clones disabled for better analysis

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e ".[dev,analytics,test]"

      - name: Install the pinned economics Schema
        # Same step pr-gate.yml and publish.yml already run, and for the same
        # reason: the economics contract-drift tests hard-require the exact
        # TraigentSchema economics contract, traigent-schema is deliberately
        # NOT a pyproject extra (a direct URL reference made traigent 0.26.0
        # unpublishable -- see the NOTE in pyproject.toml), and the pin lives
        # in scripts/ci/schema-pin.txt as the single source of truth.
        #
        # This lane was the one internal lane that never picked that up, so
        # tests/unit/economics/* errored here and nowhere else, and the code
        # they cover recorded as uncovered -- which is what drove SonarCloud's
        # new-code coverage number, not the PRs it was failing.
        #
        # Credential-free on purpose: TraigentSchema is a PUBLIC repo, so no
        # token is needed to resolve this pin (injecting one broke Dependabot
        # PRs, which never receive org secrets).
        run: |
          pip install -r scripts/ci/schema-pin.txt

      - name: Run tests with coverage
        run: |
          # Run unit tests to ensure coverage for all changed code.
          #
          # The run is still non-fatal: this lane exists to produce coverage,
          # not to gate on tests (pr-gate.yml does that). But a bare `|| true`
          # made a partial run INVISIBLE -- 114 failures and 20 errors once
          # left this step green while the resulting partial coverage.xml
          # drove SonarCloud to fail a PR's Quality Gate on "new code
          # coverage", pointing the reader at the PR instead of at the lane.
          # Capture the status and surface it as an annotation so the number
          # below can be trusted, or knowingly not.
          set +e
          pytest tests/unit/ \
            --cov=traigent \
            --cov-report=xml \
            --cov-report=term \
            -q \
            --timeout=30
          pytest_rc=$?
          set -e
          if [ "$pytest_rc" -ne 0 ]; then
            echo "::error title=Coverage run was not clean::pytest exited ${pytest_rc}. The coverage.xml uploaded below is PARTIAL, so SonarCloud's new-code coverage is a lower bound on this commit, not a measurement of it. Fix the failures before reading the Quality Gate as a statement about the PR."
          fi
        timeout-minutes: 10  # Step-level timeout for tests
        env:
          TRAIGENT_MOCK_LLM: "true"
          TRAIGENT_OFFLINE_MODE: "true"

      - name: Run MCP coverage append
        run: |
          # Same treatment as the step above: non-fatal, but never silent.
          pip install -e ".[mcp]"
          set +e
          pytest tests/unit/mcp/test_local_server.py \
            tests/unit/analytics_mcp/test_observability_mcp_tools.py \
            --cov=traigent \
            --cov-append \
            --cov-report=xml \
            --cov-report=term \
            -q \
            --timeout=30
          pytest_rc=$?
          set -e
          if [ "$pytest_rc" -ne 0 ]; then
            echo "::error title=MCP coverage append was not clean::pytest exited ${pytest_rc}; the appended coverage is partial."
          fi
        timeout-minutes: 5
        env:
          TRAIGENT_MOCK_LLM: "true"
          TRAIGENT_OFFLINE_MODE: "true"

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Note skipped SonarCloud upload
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::notice title=SonarCloud upload skipped::SONAR_TOKEN is unavailable (Dependabot or fork PR cannot read repository Actions secrets). Skipping the SonarCloud upload; unit tests and coverage still ran above. Full analysis runs on pushes to main and on same-repo human PRs where the token is present."
