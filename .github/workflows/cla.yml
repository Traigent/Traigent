name: CLA Assistant

# Contributor License Agreement check (CLA Assistant Lite).
# Uses pull_request_target so the job runs in the base repository with a token
# that can comment and store signatures. SECURITY: this workflow must never
# check out or execute pull-request code; it only calls the pinned action.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# No workflow-level grants; the job declares exactly what the action needs.
permissions: {}

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write # writes signatures/cla.json on the dedicated cla-signatures branch only
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Traigent/Traigent/blob/main/CONTRIBUTOR-LICENSING.md
          path-to-signatures: signatures/cla.json
          # Dedicated, unprotected branch (must exist before the first run).
          branch: cla-signatures
          allowlist: nimrodbusany,IsraelTraigent,dependabot[bot],github-actions[bot]
