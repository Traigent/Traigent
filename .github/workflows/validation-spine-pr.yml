# Validation Spine — PR-time scope-mode run.
#
# Runs the Traigent validation spine's `security-ledger` detector against
# only this PR's changed files. Calibrated against the 2026-05-07 → 2026-05-14
# burn-down — see ops/_validation/catalog/security_markers.yaml (Phase A
# section) for the marker classes this currently catches:
#
#   - weak_crypto_constant         (Traigent #948 hard-coded salt)
#   - permission_default_too_permissive (Traigent #937, #945)
#   - placeholder_return_pattern   (Traigent #949, #947, #951)
#   - assert_in_production         (Schema-pattern asserts)
#   - llm_permission_bypass        (CWE-917 bypassPermissions calls)
#   - sql_injection / path_traversal / command_injection / ... (pre-existing classes)
#
# This run is **advisory** for the first calibration window — it uploads
# the gap report as an artifact and surfaces critical findings as a soft
# warning. Promote to blocking (`--gate`) only after the false-positive
# rate has been confirmed acceptable.

name: validation-spine-pr

# Moved off `pull_request` to a nightly schedule (CI-rationalization plan):
# this scan is advisory (`continue-on-error: true`), secret-gated on
# SPINE_RO_TOKEN (skips cleanly when absent), and scans the FULL product repo
# on every run — so it produces no real PR verdict and only adds PR wall-clock.
# It now runs nightly + on demand; promote back to PR-time only after it is
# calibrated to gate (`--gate`) on PR-incremental scope.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validation-spine-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spine-pr-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: job-level `continue-on-error: true` was removed 2026-07-25. It made
    # *infrastructure* failures invisible, not just findings: on run 30148657774
    # `Checkout validation spine` failed outright (expired VALIDATION_CI_PAT),
    # every subsequent step was skipped, the job concluded `failure` — and the
    # workflow still reported `success`. Advisory-findings behaviour is
    # preserved by the step-level `continue-on-error` on the scan itself, which
    # is the only step whose output is meant to be non-blocking.
    env:
      # MUST point at a spine commit that has the `validation security-ledger` CLI
      # (added 2026-05-14, commit 42bbba8). The old pin 0dc2d057 (2026-05-13)
      # predated it, so the scan exited "invalid choice: security-ledger" and
      # failed with "no gap report emitted". Matches TraigentSchema develop's pin.
      # When changing the scan command below, bump this ref in lockstep.
      SPINE_REF: 7766f10589b24971696c63d0235763a743cd9cd3  # pragma: allowlist secret
      SPINE_FILE_LIMIT: "5000"
      # SPINE_RO_TOKEN was an org secret with `visibility: private`, which makes
      # it invisible to THIS repo (Traigent/Traigent is public) — see
      # tools/secret-ops/setup-spine-dispatch-app.sh in the workspace repo. Use
      # the spine-dispatch GitHub App installation token instead: it is not a
      # PAT and is not subject to per-user SAML SSO revocation.
      SPINE_APP_ID: ${{ secrets.SPINE_DISPATCH_APP_ID }}

    steps:
      # Checkout the product repo as $GITHUB_WORKSPACE/Traigent/ so the
      # spine's hardcoded multi-repo layout (`_PYTHON_REPOS` in
      # security_ledger/graph.py) finds the source under the expected
      # `<workspace>/Traigent/` subpath. Other product repos in
      # `_PYTHON_REPOS` are simply absent from this CI checkout, which
      # the spine handles by skipping missing dirs.
      - name: Checkout product repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          path: Traigent

      # Mint a short-lived installation token for the spine-dispatch App instead
      # of using a PAT. `owner:` with no `repositories:` is required so the
      # token can reach traigent-validation-spine (a sibling repo, not this
      # one) — scoping `repositories:` here would mint a token good for this
      # repo only and the checkout below would 404.
      - name: Mint spine-dispatch App token
        id: spine-app-token
        if: env.SPINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SPINE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SPINE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # continue-on-error here does NOT mean "tolerate a broken scan". It exists only so
      # this workflow can tell "token absent"/"mint failed" apart from "token present but
      # unusable" (App not installed on the spine repo, missing Contents:Read) and report the
      # precise reason. Either way the job still fails closed below.
      - name: Checkout validation spine
        id: spine-checkout
        continue-on-error: true
        if: steps.spine-app-token.outputs.token != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: Traigent/traigent-validation-spine
          ref: ${{ env.SPINE_REF }}
          path: .spine
          token: ${{ steps.spine-app-token.outputs.token }}

      # Availability is proven by the checkout actually SUCCEEDING, not by the token merely
      # being non-empty. On 2026-07-25 the org token existed everywhere and was rejected by
      # SAML enforcement / missing scope — a presence check calls that "available".
      # Every downstream step keys off SPINE_AVAILABLE. Ported from TraigentSchema#349.
      - name: Determine spine availability
        id: spine-available
        run: |
          if [ "${{ steps.spine-checkout.outcome }}" = "success" ] && [ -d "$GITHUB_WORKSPACE/.spine" ]; then
            echo "SPINE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "SPINE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      # Fail closed — a scan that cannot run must not report success.
      - name: Fail closed on missing spine token
        if: env.SPINE_AVAILABLE != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "::notice::spine-dispatch App token unavailable for dependabot PR (secrets blocked by design); spine scan skipped - dependabot bumps carry no policy surface."
            exit 0
          fi
          if [ -z "${SPINE_APP_ID}" ]; then
            reason="repository secrets SPINE_DISPATCH_APP_ID / SPINE_DISPATCH_APP_PRIVATE_KEY are not configured"
          elif [ "${{ steps.spine-app-token.outcome }}" != "success" ]; then
            reason="minting a spine-dispatch App installation token failed (check the App ID/private key)"
          else
            reason="the App token could not check out Traigent/traigent-validation-spine (App not installed on that repo, suspended, or missing Contents:Read)"
          fi
          echo "::error::Validation spine scan FAILED TO RUN — ${reason}. Failing closed: a scan that cannot execute must not report success."
          {
            echo "## Validation Spine — PR scan"
            echo
            echo "**No gap report was produced.** Absence of findings is not evidence of none."
            echo "Reason: ${reason}."
            echo "This job does **not** report success when the scan cannot run."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Set up Python 3.11
        if: env.SPINE_AVAILABLE == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        if: env.SPINE_AVAILABLE == 'true'
        run: pip install --upgrade pip "uv==0.8.13"

      - name: Verify spine uv.lock is current
        if: env.SPINE_AVAILABLE == 'true'
        working-directory: .spine
        run: uv lock --check

      - name: Install spine
        if: env.SPINE_AVAILABLE == 'true'
        working-directory: .spine
        run: uv sync --extra dev

      - name: Run security_ledger against product repo
        if: env.SPINE_AVAILABLE == 'true'
        id: spine-run
        continue-on-error: true
        working-directory: .spine
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.spine-health"
          # Advisory mode: do NOT pass --gate yet. Promote once calibrated.
          # NOTE: this currently scans the FULL product repo on every PR
          # rather than only the PR's changed files. PR-incremental scope
          # (`--base-ref`) requires `resolve_change_scope` to separate
          # "where to run git" from "anchor for path reanchoring", which
          # is a spine-internal refactor tracked as a follow-up. For now
          # we accept the backlog noise — `continue-on-error: true`
          # makes findings advisory.
          ./.venv/bin/validation security-ledger run \
            --workspace-root "$GITHUB_WORKSPACE" \
            --health-dir "$GITHUB_WORKSPACE/.spine-health" \
            --file-limit "$SPINE_FILE_LIMIT"

      # A scan that examined zero files is not a clean scan. The spine's
      # security_ledger only knows the repos listed in `_PYTHON_REPOS`
      # (Traigent, TraigentBackend, TraigentSchema). If this repo ever drops
      # out of that list, or the checkout subpath drifts, the report comes
      # back with `file_count: 0` and every gate below passes vacuously —
      # exactly how TraigentFrontend and traigent-js scanned nothing while
      # reporting success. Assert the scan had subjects.
      - name: Assert the scan examined files
        if: env.SPINE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          graph="$GITHUB_WORKSPACE/.spine-health/latest-security-graph.json"
          if [ ! -f "$graph" ]; then
            echo "::error::no security graph emitted; the scan did not run."
            exit 1
          fi
          files="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['scope_summary']['file_count'])" "$graph")"
          echo "spine scan examined $files files"
          if [ "$files" -eq 0 ]; then
            echo "::error::spine scan examined 0 files — this repo is not covered by the scanner (see _PYTHON_REPOS in the spine's security_ledger/graph.py). A zero-subject scan cannot pass."
            exit 1
          fi

      - name: Summarize new critical findings
        if: always() && env.SPINE_AVAILABLE == 'true'
        working-directory: .spine
        run: |
          set -e
          GAPS="$GITHUB_WORKSPACE/.spine-health/latest-security-ledger-gaps.json"
          if [[ ! -f "$GAPS" ]]; then
            echo "::warning::no gap report emitted (spine run failed?)"
            exit 0
          fi
          # Count critical / high gaps the new run produced. The summary
          # is informational; reviewers should also browse the uploaded
          # artifact for full context.
          ./.venv/bin/python - <<'PY'
          import json, os, pathlib
          gaps_path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".spine-health" / "latest-security-ledger-gaps.json"
          data = json.loads(gaps_path.read_text())
          by_severity = (data.get("summary") or {}).get("by_severity") or {}
          critical = by_severity.get("critical", 0)
          high     = by_severity.get("high", 0)
          medium   = by_severity.get("medium", 0)
          step_summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with step_summary.open("a") as fh:
              fh.write(f"## Validation Spine — PR scan\n\n")
              fh.write(f"| Severity | Count |\n| --- | ---: |\n")
              fh.write(f"| critical | {critical} |\n| high | {high} |\n| medium | {medium} |\n\n")
              if critical:
                  fh.write("**Critical findings — review before merge.** ")
                  fh.write("Full detail in the `validation-spine-gaps` artifact below.\n")
              else:
                  fh.write("No critical findings.\n")
          print(f"critical={critical} high={high} medium={medium}")
          if critical:
              # Soft warning — does not fail the job (continue-on-error is on
              # at the job level too). Promote to `exit 1` once calibrated.
              print(f"::warning::spine reported {critical} critical finding(s); see artifact")
          PY

      - name: Upload spine gap artifacts
        if: always() && env.SPINE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validation-spine-gaps
          path: .spine-health/
          # `.spine-health` is a dot-directory, and upload-artifact excludes
          # hidden paths by default — so this artifact has never actually
          # uploaded ("No files were found with the provided path"), and
          # `if-no-files-found: warn` kept that quiet. The findings the scan
          # produces are the only reviewable evidence it exists to produce.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
