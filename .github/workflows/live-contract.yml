name: Live Contract

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "traigent/cloud/**"
      - "traigent/core/backend_session_manager.py"
      - "tests/cloud/test_sync_live_contract.py"
      - "tests/integration/backend/**"
      - "tests/conftest.py"
      - ".github/workflows/live-contract.yml"

permissions:
  contents: read

concurrency:
  group: live-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-backend-live-contract:
    # A fork PR cannot read secrets, so the App token below can never be
    # minted there and this lane genuinely cannot run. Skip the whole JOB in
    # that one case -- a skipped job is visibly skipped in the checks UI.
    # It must never RUN with its real steps individually skipped, which is
    # what the old per-step `if: env.LIVE_CONTRACT_CHECKOUT_TOKEN != ''`
    # guards did: with the secret unset, all 14 substantive steps no-opped
    # and the job still reported success in 5-15s (it did so on the 0.26.0
    # promotion PR, the one check answering "does SDK main match BE main",
    # without ever looking). Every other trigger (schedule/dispatch/same-repo
    # PR) always has the secrets, so for them a missing/broken credential
    # remains a hard job failure below, never a skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_PORT: "8016"
      DB_PORT: "25432"
      REDIS_PORT: "26379"
      SDK_DIR: ${{ github.workspace }}/Traigent
      BACKEND_DIR: ${{ github.workspace }}/TraigentBackend
      SCHEMA_DIR: ${{ github.workspace }}/TraigentSchema
      COMPOSE_PROJECT_NAME: live-contract-${{ github.run_id }}-${{ github.run_attempt }}
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}

    steps:
      # Fail, don't skip. Past the fork-PR job-level guard above, this run is
      # in a context that HAS secrets, so a missing App credential here is
      # operator misconfiguration, not a legitimate skip -- reporting green
      # for a contract that was never executed is exactly the defect this
      # lane exists to avoid (see the job-level comment above).
      - name: Require the CI read App to be configured
        if: ${{ env.CI_READ_APP_ID == '' }}
        run: |
          echo "::error::CI_READ_APP_ID / CI_READ_APP_PRIVATE_KEY are not configured on this repo."
          echo "::error::This lane checks out sibling private repos (TraigentBackend, TraigentSchema) and cannot run without them."
          echo "::error::Provision them with tools/secret-ops/setup-ci-read-app.sh (see tools/secret-ops/BROWSER-AGENT-ci-read-app.md)."
          echo "::error::Refusing to report success for a contract that was never executed."
          exit 1

      # actions/create-github-app-token pinned to the same SHA already used
      # elsewhere in this repo for App-token minting (js-public-parity.yml,
      # spine-trail-gate.yml, validation-g8-dispatch.yml,
      # validation-spine-pr.yml). No continue-on-error: if the App isn't
      # actually installed on these repos, or the stored key is stale/
      # invalid, this step fails and the job stops here -- loud, not silent.
      - name: Mint CI read token
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
          owner: Traigent
          # Least privilege per workflow: only the two siblings this lane
          # checks out. The traigent-ci-read App installation itself is
          # org-wide (Contents: Read-only); this narrows the minted token.
          repositories: TraigentBackend,TraigentSchema

      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          path: Traigent
          # This lane never pushes; don't leave the token in .git/config where a
          # later step or third-party action could read it (Aikido hardening).
          persist-credentials: false

      - name: Checkout TraigentBackend develop
        uses: actions/checkout@v7
        with:
          repository: Traigent/TraigentBackend
          ref: develop
          path: TraigentBackend
          # This repo's default GITHUB_TOKEN cannot read sibling private
          # repos; use the short-lived traigent-ci-read App installation
          # token minted above instead.
          token: ${{ steps.ci-token.outputs.token }}
          persist-credentials: false

      - name: Checkout TraigentSchema develop
        uses: actions/checkout@v7
        with:
          repository: Traigent/TraigentSchema
          ref: develop
          path: TraigentSchema
          # This repo's default GITHUB_TOKEN cannot read sibling private
          # repos; use the short-lived traigent-ci-read App installation
          # token minted above instead.
          token: ${{ steps.ci-token.outputs.token }}
          persist-credentials: false

      - name: Verify backend provides the CI mint script
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # Fail fast with an actionable message instead of booting the whole
          # stack and dying at key-mint time. The script ships in the companion
          # TraigentBackend PR (ci/ephemeral-key-fixture); this lane requires
          # that PR to be merged to develop first.
          if [ ! -f scripts/ci/mint_ci_api_key.py ]; then
            echo "::error::TraigentBackend@develop lacks scripts/ci/mint_ci_api_key.py — merge the companion backend PR (ci: ephemeral CI API key) before enabling this lane."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip "uv==0.8.13"

      # This lane checks out three repos into sibling directories, so the
      # workspace root has no pyproject.toml -- the check must name the SDK.
      - name: Verify uv.lock is current
        working-directory: ${{ env.SDK_DIR }}
        run: uv lock --check

      - name: Prepare compose environment
        run: |
          set -euo pipefail

          write_masked_env() {
            local name="$1"
            local value
            value="$(openssl rand -hex 32)"
            if [ -z "$value" ]; then
              echo "::error::openssl produced an empty value for ${name}." >&2
              return 1
            fi
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          write_masked_env JWT_SECRET_KEY
          write_masked_env SECRET_KEY
          write_masked_env TRAIGENT_MASTER_KEY
          write_masked_env TRAIGENT_ID_SECRET

      - name: Start dockerized backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            -f docker/docker-compose.dev.yml \
            up -d --wait postgres redis backend

      - name: Poll backend health
        run: |
          for attempt in {1..60}; do
            if curl -fsS "http://localhost:${API_PORT}/health" >/dev/null; then
              exit 0
            fi
            echo "backend health not ready yet (${attempt}/60)"
            sleep 2
          done
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            -f "$BACKEND_DIR/docker/docker-compose.dev.yml" \
            ps
          exit 1

      - name: Mint live-contract API key
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail

          # The mint script writes the raw key to a private (0600) file inside
          # the container — never to stdout — so the secret can't leak into
          # captured CI output or race ::add-mask::. Read it back, mask it, then
          # delete the file.
          compose() {
            docker compose -p "$COMPOSE_PROJECT_NAME" \
              -f docker/docker-compose.dev.yml "$@"
          }
          compose exec -T backend python scripts/ci/mint_ci_api_key.py \
            --out /tmp/ci_api_key

          # Redirect stdout before reading the key so the docker command cannot
          # put the raw value in the Actions log before it is masked.
          key_file="$(mktemp)"
          trap 'rm -f -- "$key_file"' EXIT
          if ! compose exec -T backend cat /tmp/ci_api_key >"$key_file"; then
            echo "::error::Could not read the minted live-contract API key." >&2
            exit 1
          fi
          key="$(<"$key_file")"
          if [ -z "$key" ]; then
            echo "mint_ci_api_key.py produced an empty key" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$key"
          compose exec -T backend rm -f /tmp/ci_api_key
          printf '%s=%s\n' "TRAIGENT_API_KEY" "$key" >> "$GITHUB_ENV"

      - name: Clean container-owned build artifacts from the SDK checkout
        working-directory: ${{ env.SDK_DIR }}
        run: |
          # The backend container pip-installs the mounted SDK, writing a
          # root-owned traigent.egg-info into this checkout; uv/pip on the
          # runner then fails with "Cannot update time stamp of directory
          # 'traigent.egg-info'". Remove it before installing SDK deps.
          sudo rm -rf traigent.egg-info

      - name: Install SDK dev dependencies
        working-directory: ${{ env.SDK_DIR }}
        run: uv sync --extra dev

      - name: Run sync live-contract test
        working-directory: ${{ env.SDK_DIR }}
        env:
          ENVIRONMENT: development
          PYTHONPATH: .
          TRAIGENT_LIVE_SYNC_E2E: "1"
        run: |
          TRAIGENT_BACKEND_URL="http://localtest.me:${API_PORT}" \
          TRAIGENT_API_URL="http://localtest.me:${API_PORT}" \
          uv run pytest tests/cloud/test_sync_live_contract.py -m contract --tb=short

      - name: Run hybrid session live test
        working-directory: ${{ env.SDK_DIR }}
        env:
          ENVIRONMENT: development
          PYTHONPATH: .
          TRAIGENT_HYBRID_LIVE: "1"
        run: |
          TRAIGENT_API_URL="http://localtest.me:${API_PORT}/api/v1" \
          TRAIGENT_BACKEND_URL="http://localtest.me:${API_PORT}" \
          uv run pytest tests/integration/backend/test_hybrid_session_live.py --tb=short

      - name: Run backend DTO live smoke
        working-directory: ${{ env.SDK_DIR }}
        env:
          ENVIRONMENT: development
          PYTHONPATH: .
          TRAIGENT_BACKEND_LIVE: "1"
        run: |
          TRAIGENT_API_URL="http://localtest.me:${API_PORT}/api/v1" \
          TRAIGENT_BACKEND_URL="http://localtest.me:${API_PORT}" \
          uv run pytest tests/integration/backend/test_backend_minimal.py --tb=short

      - name: Backend logs on failure
        if: ${{ failure() }}
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            -f docker/docker-compose.dev.yml \
            logs --tail=300 backend

      - name: Stop dockerized backend
        if: ${{ always() }}
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            -f docker/docker-compose.dev.yml \
            down -v --remove-orphans
