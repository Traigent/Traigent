name: Traigent CI Gates

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Ref (branch, tag or SHA) to use as the regression baseline; the head is the ref this run is dispatched on"
        required: false
        default: develop
        type: string

permissions:
  contents: read

env:
  TRAIGENT_MOCK_LLM: "true"
  TRAIGENT_OFFLINE_MODE: "true"
  CI: "true"
  TRAIGENT_RUN_APPROVED: "1"  # Auto-approve CI runs for testing
  TRAIGENT_APPROVED_BY: "github-actions"
  REGRESSION_THRESHOLD: "-0.01"  # 1% regression blocks
  IMPROVEMENT_MIN_PCT: "0.03"    # 3% improvement triggers warning

jobs:
  optimization-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.base_ref }}
          path: baseline

      - name: Checkout head (the ref this workflow was dispatched on)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: work

      - name: Require distinct baseline and head commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          base_sha="$(git -C baseline rev-parse HEAD)"
          head_sha="$(git -C work rev-parse HEAD)"
          echo "baseline ($BASE_REF): $base_sha"
          echo "head: $head_sha"
          if [ "$base_sha" = "$head_sha" ]; then
            echo "::error::Baseline ($BASE_REF) and head resolve to the same commit ($head_sha). The regression gate would compare the code with itself. Dispatch this workflow on the branch under test and pass a different base_ref."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Separate virtualenvs: an editable install of the head must not replace the
      # baseline SDK, or an SDK regression would be measured on both sides.
      - name: Install dependencies (baseline)
        working-directory: baseline
        run: |
          python -m venv "$GITHUB_WORKSPACE/venv-baseline"
          "$GITHUB_WORKSPACE/venv-baseline/bin/python" -m pip install -e ".[dev,analytics,integrations]"

      - name: Install dependencies (head)
        working-directory: work
        run: |
          python -m venv "$GITHUB_WORKSPACE/venv-head"
          "$GITHUB_WORKSPACE/venv-head/bin/python" -m pip install -e ".[dev,analytics,integrations]"

      - name: Copy dataset to baseline if missing
        run: |
          # Reachable now that the baseline is a distinct ref: the head may add the dataset
          # that an older base_ref does not have yet.
          if [ ! -f "baseline/examples/integrations/ci-cd/math-qa/math_qa.jsonl" ]; then
            echo "Dataset missing in baseline, copying from PR branch..."
            cp work/examples/integrations/ci-cd/math-qa/math_qa.jsonl baseline/examples/integrations/ci-cd/math-qa/
          fi

      - name: Evaluate baseline configuration
        working-directory: baseline/examples/integrations/ci-cd/math-qa
        run: |
          "$GITHUB_WORKSPACE/venv-baseline/bin/python" -c "import os, pathlib, traigent; p = pathlib.Path(traigent.__file__).resolve(); print('traigent from', p); p.relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'baseline').resolve())"
          MODE=eval "$GITHUB_WORKSPACE/venv-baseline/bin/python" run.py
          echo "Baseline evaluation complete"

      - name: Copy baseline results
        run: |
          mkdir -p work/examples/integrations/ci-cd/math-qa/results-ci/baseline
          cp -r baseline/examples/integrations/ci-cd/math-qa/results-ci/math/* work/examples/integrations/ci-cd/math-qa/results-ci/baseline/

      - name: Evaluate PR configuration
        working-directory: work/examples/integrations/ci-cd/math-qa
        run: |
          "$GITHUB_WORKSPACE/venv-head/bin/python" -c "import os, pathlib, traigent; p = pathlib.Path(traigent.__file__).resolve(); print('traigent from', p); p.relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'work').resolve())"
          MODE=eval "$GITHUB_WORKSPACE/venv-head/bin/python" run.py
          echo "PR evaluation complete"

      - name: Run optimization on PR
        working-directory: work/examples/integrations/ci-cd/math-qa
        run: |
          MODE=tune MAX_TRIALS=10 "$GITHUB_WORKSPACE/venv-head/bin/python" run.py
          echo "Optimization complete"

      - name: Compare metrics
        working-directory: work/examples/integrations/ci-cd
        run: |
          python - << 'EOF'
          import json
          import sys

          # Load results
          with open('math-qa/results-ci/baseline/current.json') as f:
              baseline = json.load(f)
          with open('math-qa/results-ci/math/current.json') as f:
              current = json.load(f)
          with open('math-qa/results-ci/math/tuned.json') as f:
              tuned = json.load(f)

          # Metric orientations
          orientations = {
              'accuracy': 'maximize',
              'cost': 'minimize',
              'response_time': 'minimize'
          }

          # Gate parameters
          REGRESSION_THRESHOLD = -0.01
          IMPROVEMENT_MIN_PCT = 0.03

          # Check for regression
          regression_found = False
          for metric, orientation in orientations.items():
              baseline_val = baseline['metrics'].get(metric, 0)
              current_val = current['metrics'].get(metric, 0)

              if orientation == 'maximize':
                  improvement = (current_val - baseline_val) / max(baseline_val, 0.001)
              else:  # minimize
                  improvement = (baseline_val - current_val) / max(baseline_val, 0.001)

              if improvement < REGRESSION_THRESHOLD:
                  print(f"❌ REGRESSION: {metric} degraded by {abs(improvement)*100:.1f}%")
                  print(f"   Baseline: {baseline_val:.3f}, Current: {current_val:.3f}")
                  regression_found = True
              else:
                  print(f"✅ {metric}: {'improved' if improvement > 0 else 'unchanged'} by {improvement*100:.1f}%")

          # Check for missed improvements
          improvement_found = False
          for metric, orientation in orientations.items():
              current_val = current['metrics'].get(metric, 0)
              tuned_val = tuned['metrics'].get(metric, 0)

              if orientation == 'maximize':
                  improvement = (tuned_val - current_val) / max(current_val, 0.001)
              else:  # minimize
                  improvement = (current_val - tuned_val) / max(tuned_val, 0.001)

              if improvement >= IMPROVEMENT_MIN_PCT:
                  print(f"⚠️  IMPROVEMENT AVAILABLE: {metric} could improve by {improvement*100:.1f}%")
                  improvement_found = True

          # Check if configs differ
          if improvement_found and tuned.get('improvement_potential', {}).get('config_differs'):
              print("\n📝 Action required: Update saved_config.json with:")
              print(json.dumps(tuned['best_config'], indent=2))
              sys.exit(1)  # Fail the CI

          if regression_found:
              sys.exit(1)  # Fail the CI

          print("\n✅ All CI gates passed!")
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results
          path: |
            work/results-ci/
            work/examples/integrations/ci-cd/math-qa/saved_config.json

          retention-days: 30
