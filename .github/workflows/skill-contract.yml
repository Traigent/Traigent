name: Skill Contract

# Advisory upstream gate: validates the traigent-skills contract against this SDK
# build, so SDK changes that would break a published skill surface are caught here
# rather than downstream in the skills repo. Runs nightly + on demand (it was moved
# off `pull_request` by the CI-rationalization plan); promote back to PR-time once
# it has been green across a few runs.
#
# 2026-08-02 — CREDENTIAL AND FAILURE MODE BOTH CHANGED.
#
# Was: gated on the SKILLS_REPO_TOKEN PAT, and "skips cleanly (green no-op)" when
# the token was absent. Two problems, one of which hid the other:
#   * the PAT died ~2026-07-15 ("Bad credentials"), and the org's 2026-07-24 SAML
#     enforcement revokes PAT SSO authorization, so replacing it in kind would
#     just fail again at the next SSO change;
#   * the skip-to-green behaviour meant a dead credential could not be
#     distinguished from a passing contract.
#
# Now: mints a short-lived installation token from the `traigent-ci-read` GitHub
# App (belongs to no person, not subject to per-user SAML authorization), and
# FAILS LOUDLY when that App is not configured. This lane is schedule- and
# dispatch-only, so it always runs where secrets exist — a missing credential is a
# misconfiguration, never an expected state. See tools/secret-ops/README-ci-github-app.md.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-contract:
    name: skill-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail, do not skip. This lane is scheduled + workflow_dispatch only, so it
      # always runs in a context that HAS secrets: a missing credential is a
      # misconfiguration. The previous "armed=false" path turned that into a
      # green no-op, which is how a dead credential stayed invisible.
      - name: Require the CI read App to be configured
        env:
          CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
        run: |
          if [ -z "${CI_READ_APP_ID:-}" ]; then
            echo "::error::CI_READ_APP_ID / CI_READ_APP_PRIVATE_KEY are not configured on this repo."
            echo "::error::Set them with tools/secret-ops/setup-ci-read-app.sh (see BROWSER-AGENT-ci-read-app.md)."
            echo "::error::Refusing to report success for a contract that was never executed."
            exit 1
          fi

      - name: Mint CI read token
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
          owner: Traigent
          # Least privilege per workflow: only the repo this lane checks out.
          repositories: traigent-skills

      - name: Checkout SDK PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout skills contract harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Traigent/traigent-skills
          token: ${{ steps.ci-token.outputs.token }}
          path: _skills

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the PR SDK + harness deps
        run: |
          python -m pip install pytest pyyaml packaging
          python -m pip install .

      - name: Run the skill contract against this PR's SDK
        run: |
          # Run from the SDK repo root so pytest resolves the SDK's pyproject as
          # rootdir, but override addopts to empty: the repo's test addopts pin
          # `-n auto --dist loadgroup` (pytest-xdist), which this self-contained
          # job deliberately does NOT install. Without the override the contract
          # run aborts with "unrecognized arguments: -n --dist" (exit 4) before a
          # single contract test executes. The skill-contract harness is
          # independent of the SDK suite's parallelism/marker/ignore config, so it
          # carries only its own explicit flags below.
          python -m pytest \
            _skills/tests/contract/test_python_contracts.py \
            _skills/tests/contract/test_env_and_cli.py \
            _skills/tests/contract/test_skill_lints.py \
            _skills/tests/contract/test_text_requirements.py \
            _skills/tests/contract/test_harness_selftest.py \
            -o addopts= -p no:cacheprovider --sdk-version=develop -q -rs
